<!-- UX4G Official Government of India Identity Banner -->
<div class="ux4g-top-banner" aria-label="Official Government of India Directory Header">
  <div class="container top-banner-container">
    <div class="top-banner-left">
      <span class="gov-flag" aria-hidden="true">🇮🇳</span>
      <span class="gov-text-hi">भारत सरकार</span>
      <span class="gov-sep" aria-hidden="true">|</span>
      <span class="gov-text-en">Government of India</span>
    </div>
    <div class="top-banner-right">
      <span class="ux4g-compliance-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>

      <span class="top-banner-subtext">Digital India • NeGD / MeitY</span>
    </div>
  </div>
</div>
